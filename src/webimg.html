<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>webimg</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="icon" href="favicon.png">
    <style>
        .iconbtn {
            width: min-content;
            height: min-content;
            padding: 4px;

            cursor: pointer;
        }

        .titlerow {
            display: flex;
            flex-direction: row;
            place-content: space-between;

            gap: 4px;

            width: 100%;
        }

        .highlight-panel {
            fill: var(--fg-0);
            stroke: var(--fg-0);
            color: var(--fg-0);
            border: 1px solid var(--fg-0);
            background-color: var(--bg-0);
            border-radius: 4px;
        }

        #perpage_ctl {
            height: min-content;
        }

        #imglib {
            min-height: 50vh;
            min-width: 50vw;
            padding: 16px;
            gap: 16px;
            border-radius: 4px;

            background-color: var(--bg-0);

            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            place-content: center;

            >img {
                object-fit: contain;

                border-radius: 4px;

                &.fs {
                    position: fixed;
                    top: 0;
                    left: 0;

                    max-width: 100vw;
                    width: 100vw;
                    height: 100vh;

                    object-fit: contain;

                    z-index: 1000;
                    backdrop-filter: blur(4px);
                }
            }

            &.full>img:not(.fs) {
                width: 80vw;
            }

            &.half>img:not(.fs) {
                width: 40vw;
            }

            &.thir>img:not(.fs) {
                width: 25vw;
            }

            &.quar>img:not(.fs) {
                width: 20vw;
            }
        }

        #tpag,
        #pag {
            display: flex;
            flex-direction: row;
            gap: 8px;

            font-size: 20px;

            button {
                cursor: pointer;
                width: 24px;
                height: 24px;

                &[disabled] {
                    opacity: 0.2;
                    cursor: default;
                }
            }

            div {
                display: flex;
                flex-direction: row;
                gap: 4px;
            }

            #pag_curr,
            #tpag_curr {
                border: none;
                width: 2.5em;
                padding: 4px;
                text-align: center;

                appearance: textfield;
                -moz-appearance: textfield;

                &::-webkit-outer-spin-button,
                &::-webkit-inner-spin-button {
                    margin: 0;
                    -webkit-appearance: none;
                }
            }
        }
    </style>
    <script>let exports = {};</script>
    <script src="/webimg.js"></script>
</head>

<body class="">
    <main>
        <div class="titlerow">
            <h1>webimg</h1>

            <button class="iconbtn highlight-panel" onclick="toggledark()">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-eclipse-icon lucide-eclipse" style="display: block;">
                    <circle cx="12" cy="12" r="10" />
                    <path d="M12 2a7 7 0 1 0 10 10" />
                </svg>
            </button>
        </div>

        <div id="tpag">
            <button id="tpag_start" class="highlight-panel" onclick="first_page()" disabled>&lt;&lt;</button>
            <button id="tpag_back" class="highlight-panel" onclick="prev_page()" disabled>&lt;</button>

            <div>
                <input type="number" id="tpag_curr" placeholder="0" min=0 step=1
                    onchange="set_page(parseInt(document.getElementById('tpag_curr').value))" />
                <span>/</span>
                <span id="tpag_total">0</span>
            </div>

            <button id="tpag_next" class="highlight-panel" onclick="next_page()" disabled>></button>
            <button id="tpag_end" class="highlight-panel" onclick="last_page()" disabled>>></button>
        </div>

        <div id="imglib" class="half">
            <div>waiting for fetch..</div>
        </div>

        <div id="pag">
            <button id="pag_start" class="highlight-panel" onclick="first_page()" disabled>&lt;&lt;</button>
            <button id="pag_back" class="highlight-panel" onclick="prev_page()" disabled>&lt;</button>

            <div>
                <input type="number" id="pag_curr" placeholder="0" min=0 step=1
                    onchange="set_page(parseInt(document.getElementById('pag_curr').value))" />
                <span>/</span>
                <span id="pag_total">0</span>
            </div>

            <button id="pag_next" class="highlight-panel" onclick="next_page()" disabled>></button>
            <button id="pag_end" class="highlight-panel" onclick="last_page()" disabled>>></button>
        </div>

        <table id="config">
            <tbody>
                <tr>
                    <td>
                        <label for="perpage_ctl">img/page</label>
                    </td>
                    <td>
                        <input name="perpage_ctl" id="perpage_ctl" class="highlight-panel" type="number"
                            onchange="set_perpage(parseInt(document.getElementById('perpage_ctl').value))" />
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="img_size_ctl">img size</label>
                    </td>
                    <td>
                        <select name="img_size_ctl" id="img_size_ctl"
                            onchange="set_img_size(document.getElementById('img_size_ctl').value)">
                            <option value="full">fullwidth</option>
                            <option value="half">half</option>
                            <option value="thir">third</option>
                            <option value="quar">quarter</option>
                        </select>
                    </td>
                </tr>
            </tbody>

        </table>
    </main>
</body>

</html>
